[project]
name = "windows_font_manager"
readme = "README.md"
requires-python = ">=3.13"
license = "AGPL-3.0-or-later"
authors = [{ name = "op200" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: Microsoft :: Windows :: Windows 10",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Typing :: Typed",
]
dependencies = [
  "easyrip>=4.19.4",
  "fastapi>=0.141.1",
  "uvicorn[standard]>=0.53.0",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/op200/windows_font_manager"
Source = "https://github.com/op200/windows_font_manager"

[project.scripts]
windows_font_manager = "windows_font_manager.__main__:run"

[dependency-groups]
dev = [
  "setuptools>=84",
]

[build-system]
requires = ["setuptools>=81"]

[tool.pyright]
typeCheckingMode = "standard"

[tool.setuptools.dynamic]
version = { attr = "windows_font_manager.__version__" }

[tool.setuptools.package-dir]
windows_font_manager = "windows_font_manager"

[tool.setuptools.package-data]
windows_font_manager = ["static/**/*"]

[tool.setuptools.cmdclass]
build = "build_hook.Build"

[[tool.tombi.schemas]]
path = "tombi://www.schemastore.org/pyproject.json"
include = ["pyproject.toml"]

[[tool.tombi.schemas]]
path = "https://www.schemastore.org/ruff.json"
include = ["ruff.toml"]

[[tool.tombi.schemas.overrides]]
targets = ["lint", "lint.*"]

[tool.tombi.schemas.overrides.format.rules]
array-values-order = "ascending"
table-keys-order = "ascending"
